name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Project pages are served from /<repo>/, so the bundle needs that base.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules; serving the app shell as 404.html
        # is what makes deep links like /prophets/musa resolve.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# ─────────────────────────────────────────────────────────────────────────
# To enable automatic deploys, move this file to .github/workflows/deploy.yml
# and push. That path needs the `workflow` OAuth scope, so run this once:
#
#     gh auth refresh -h github.com -s workflow
#     git mv deploy/github-pages.yml .github/workflows/deploy.yml
#     git commit -m "Enable Pages deploy workflow" && git push
#
# Until then the site is deployed from the gh-pages branch instead, which
# needs no extra scope — see "Deploying" in the README.
# ─────────────────────────────────────────────────────────────────────────
